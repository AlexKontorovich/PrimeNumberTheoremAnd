name: Auto-label AI-assisted PRs

# Scans the PR body for the disclosure phrases documented in
# PULL_REQUEST_STYLE.md §13.1 (e.g. "Made with Cursor", "Co-Authored-By:
# Claude", etc.) and applies the corresponding tool-specific label plus
# the `ai` umbrella label. Lets outside contributors (who cannot select
# labels themselves) get the correct labels automatically just by writing
# the disclosure line in the PR body.
#
# Runs on `pull_request_target` so it has label-write permission for PRs
# opened from forks. Safe here because it never checks out or executes
# any code from the PR — it only reads `context.payload.pull_request.body`
# via the GitHub API and calls `addLabels`.

on:
  pull_request_target:
    types: [opened, edited, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Apply AI-disclosure labels from PR body
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = (context.payload.pull_request.body || '').toLowerCase();

            // label => substrings (all lowercased) that trigger it.
            // Patterns require a disclosure verb ("made with", "generated by",
            // "co-authored-by") plus the tool name, so a stray mention like
            // "we can't use gpt here" does NOT trigger a label.
            const RULES = [
              ['aristotle',   ['made with aristotle', 'generated with aristotle',
                               'generated by aristotle', 'aristotle by harmonic']],
              ['alpha-proof', ['made with alphaproof', 'made with alpha-proof',
                               'generated with alphaproof', 'generated by alphaproof',
                               'alphaproof by deepmind']],
              ['claude',      ['made with claude', 'generated with claude',
                               'generated by claude', 'generated with [claude',
                               'co-authored-by: claude', 'claude code']],
              ['cursor',      ['made with cursor', 'generated with cursor',
                               'generated by cursor', 'co-authored-by: cursor']],
              ['gemini',      ['made with gemini', 'generated with gemini',
                               'generated by gemini', 'co-authored-by: gemini']],
              ['gpt',         ['made with gpt', 'made with chatgpt', 'made with codex',
                               'generated with gpt', 'generated by gpt',
                               'generated with chatgpt', 'generated by chatgpt',
                               'co-authored-by: chatgpt', 'co-authored-by: gpt']],
              ['seed',        ['made with seed', 'made with bytedance seed',
                               'seed by bytedance']],
            ];

            const toAdd = new Set();
            for (const [label, needles] of RULES) {
              if (needles.some(n => body.includes(n))) toAdd.add(label);
            }

            // Any tool-label match implies the umbrella `ai` label.
            // Also honour a bare disclosure without a specific tool.
            if (toAdd.size > 0 || /\bai[-\s]assisted\b|made with (an?\s+)?ai\b/.test(body)) {
              toAdd.add('ai');
            }

            if (toAdd.size === 0) {
              core.info('No AI-disclosure phrase detected in PR body.');
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: [...toAdd],
            });
            core.info(`Applied labels: ${[...toAdd].join(', ')}`);
